<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<style>
    body{
        background-color: yellow;
        color: green;
        border : 2px solid red; /*border,padding en margin worden nooit doorgegeven aan de kleinkinderen*/
        font-size: 5em;
    }
    h1 {
        color: red;
        background-color: blue;
        width: 50%;
        font-size: 3em;
        border: 1px solid red;
        margin: 50px;
        margin-top: 150px;
        margin-bottom: 300px;
        padding: 75px;
        padding: 5px 20px 100px 300px; /*alles in 1 lijn ipv paddingbottem, paddingtop,... --> top=5px, right=20px, bottem=100px, left=300px*/

    }
    span{
        width: 400px;
        display: inline-block;


    }
    p{
        width: 49%;
        display: inline-block;
        background-color: grey;
    }
    img{
        display: block;
        margin-left: auto;
        margin-right: auto;
        border : 50px WindowFrame ridge; /* gewone border --> solid dan kleur*/
    }
</style>

<h1>Vives</h1>
<h1>CSS</h1>
